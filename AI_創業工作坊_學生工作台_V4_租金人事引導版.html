<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 創業大挑戰｜V4 月租與人事引導版</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:#f4f7fc;color:#16253c}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:20px}header{background:linear-gradient(100deg,#122b48,#17617a);color:#fff;padding:25px 18px}header .shell{padding:0}header h1{margin:7px 0;font-size:clamp(24px,4vw,36px)}header p{margin:0;opacity:.85}.pill{display:inline-block;border-radius:30px;background:#d5f4eb;color:#155d55;padding:5px 12px;font-size:12px;font-weight:800}.layout{display:grid;grid-template-columns:220px 1fr;gap:15px}.nav,.panel{background:white;border:1px solid #e0e6ef;border-radius:18px;padding:18px;box-shadow:0 5px 18px #152d4610}.nav{align-self:start;position:sticky;top:10px}.step{width:100%;display:block;border:0;background:transparent;text-align:left;margin:6px 0;padding:13px;border-radius:11px;color:#345;font-weight:700}.step.active{background:#176b8d;color:white}.step.done:before{content:'✓ ';color:#31ad82}.step.active.done:before{color:#fff}.panel{min-height:500px}h2{font-size:23px;margin:0 0 8px}h3{margin:20px 0 8px;font-size:16px}.hint{color:#576b80;font-size:13px;line-height:1.6}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:14px;font-weight:700;margin-top:12px}input,textarea,select{display:block;width:100%;border:1px solid #ccd8e3;border-radius:10px;font:inherit;padding:10px;margin-top:5px;background:#fff}textarea{min-height:76px;resize:vertical}button{font:inherit;cursor:pointer}.btn{border:0;background:#176b8d;color:white;border-radius:11px;padding:11px 16px;font-weight:800}.btn.alt{background:white;color:#17617a;border:1px solid #bfd5df}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:19px 0 4px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{border:1px solid #dfebf4;background:#f7fafc;padding:13px;border-radius:12px}.tile strong{display:block;margin-top:4px;font-size:21px}.box{background:#eef6fc;border-left:4px solid #237caa;padding:12px;border-radius:9px;margin:15px 0}.story{background:#fef7e8;border-left:4px solid #c88636;padding:12px;border-radius:9px;margin:12px 0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:11px}td,th{border-bottom:1px solid #dce5ed;padding:9px 6px;text-align:left;font-size:13px}th{background:#eff6fb}td input{min-width:95px}.budget-head{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:10px}.budget-head label{flex:1;min-width:220px;margin-top:0}.budget-head button{margin-bottom:0}.budget-table td:nth-child(2){width:35%}.budget-table .cost-note{font-size:12px;color:#52677e;margin-top:5px;line-height:1.5}.budget-total{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#eaf6f0;border:1px solid #b9dfcb;border-radius:11px;margin:12px 0;padding:12px 15px}.budget-total strong{font-size:22px;color:#146a51}.budget-status{font-size:12px;color:#5d6672;margin-top:5px}.SWOT{display:grid;grid-template-columns:1fr 1fr;gap:10px}.SWOT label{margin:0;padding:9px;border-radius:12px;background:#f1f6fa}.big{font-size:20px;font-weight:800}.bad{color:#bd3f43}.good{color:#18745b}.hide{display:none}footer{color:#66778c;text-align:center;font-size:12px;padding:24px}.printpage{display:none}@media(max-width:750px){.layout{display:block}.nav{position:static;display:flex;overflow-x:auto;gap:5px;margin-bottom:12px;padding:8px}.step{white-space:nowrap;width:auto}.formgrid,.grid3,.SWOT{grid-template-columns:1fr}.shell{padding:12px}.panel{padding:15px}}@media print{body{background:#fff}.shell,header,footer{display:none!important}.printpage{display:block;font:11pt 'Noto Sans TC',Arial,sans-serif;color:#182538}.paper{min-height:245mm;padding:12mm;break-after:page;page-break-after:always}.paper:last-child{break-after:auto}.paper h1{font-size:23pt;color:#164c66}.paper h2{font-size:17pt;color:#164c66}.paper h3{font-size:12pt}.paper table{font-size:9pt}.paper td,.paper th{border:1px solid #cdd9e4;padding:5px}.paper p{white-space:pre-wrap}.pbox{border:1px solid #ccdce9;background:#f7fafc;border-radius:6px;padding:9px;margin:8px 0;white-space:pre-wrap}.paper .twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.paper .twocol>div{border:1px solid #d9e5ee;padding:8px}.small{font-size:9pt;color:#687789}}
</style></head><body><header><div class="shell"><span class="pill">5 組 × 10 人｜150 分鐘工作坊</span><h1>AI 創業大挑戰</h1><p>設計思考 → 市場偵探 → SWOT → 財務試算 → 一鍵報告</p></div></header><main class="shell"><div class="box">📌 <b>開始前：</b>全組共用一台主要裝置進行填寫，其他組員可用手機查資料。資料只保存在目前瀏覽器，<b>不會自動交給老師</b>。每個階段完成後記得按「備份 JSON」。最後列印成 PDF 上傳 TronClass。</div><div class="layout"><aside class="nav" id="nav"></aside><section class="panel" id="stage"></section></div></main><footer>課堂教學模擬・非銀行正式貸款申請・所有市場價格應標示來源或「假設」</footer><div class="printpage" id="report"></div><script>
(()=>{'use strict';const STORAGE='aiShopWorkshop2026v3';const stages=['① 找問題與想點子','② 商圈偵探','③ SWOT 與策略','④ 創業財務','⑤ 決策與報告'];let step=0;const budgetPresets={custom:{name:'其他店型｜通用小型攤位參考',items:[['主要設備與器具',40000],['場地押金與布置',35000],['首批原料與包材',10000],['開辦費及週轉金',25000]],hints:['依實際店型自行填入必要設備，如烤箱、冷藏、爐具、工作檯','依固定店、快閃攤或攤車調整押金及布置成本','依產品調整首次食材、包材及耗材','預留周轉現金；不等於已支出的營業費用']},coffee:{name:'外帶咖啡攤',items:[['設備與器具',60000],['押金與簡易裝修',50000],['初期原物料',10000],['開辦費及週轉金',30000]],hints:['咖啡機、磨豆機、冰箱與工作器具','租金押金、招牌、工作檯及基礎設施','咖啡豆、鮮奶、紙杯及包材','開辦雜費及起步時預留的現金']},rice:{name:'飯糰早餐攤',items:[['設備與器具',45000],['押金與簡易裝修',35000],['初期原物料',10000],['開辦費及週轉金',30000]],hints:['飯鍋、保溫設備、工作檯與器具','攤位押金、招牌及簡易設施','米、內餡、海苔與包材','開辦雜費與營運預備金']},waffle:{name:'雞蛋糕攤',items:[['設備與器具',45000],['押金與簡易裝修',25000],['初期原物料',10000],['開辦費及週轉金',20000]],hints:['雞蛋糕機、操作檯與小型冷藏設備','攤位押金、招牌與簡易裝設','麵糊原料、內餡及包材','開辦雜費與現金預備金']},dessert:{name:'甜點快閃攤',items:[['設備與器具',25000],['押金與簡易裝修',25000],['初期原物料',10000],['開辦費及週轉金',20000]],hints:['冷藏展示、保冷設備與陳列器材','快閃場地押金、招牌與攤位布置','甜點食材及包材','開辦雜費與現金預備金']},bubble:{name:'手搖飲小店',items:[['設備與器具',125000],['押金與簡易裝修',110000],['初期原物料',20000],['開辦費及週轉金',45000]],hints:['封口機、製冰、冷藏、製茶與工作設備','押金、招牌及簡易裝修工程','茶葉、糖漿、配料、杯材','開辦雜費與營運備用現金']}};const budgetHints=['請依店型調整主要設備','包含押金、招牌與基本設施','首次進貨與包材','開辦雜費與營運預備金'];const defaults={team:'',members:'',pain:'',customer:'',problem:'',ideas:['','',''],chosen:'',reason:'',different:'',shop:'',location:'',rivals:[{name:'',price:'',pro:'',source:''},{name:'',price:'',pro:'',source:''},{name:'',price:'',pro:'',source:''}],s:'',w:'',o:'',t:'',strategy:'',budgetPreset:'custom',budgetEdited:false,budgetReason:'',rentMode:'manual',staffMode:'manual',partTimeHours:4,hourlyRate:200,fullTimeMonthly:36000,expenseReason:'',investment:[['主要設備與器具',40000],['場地押金與布置',35000],['首批原料與包材',10000],['開辦費及週轉金',25000]],price:85,customers:65,days:25,unitCost:35,rent:18000,staff:38000,other:8000,kiosk:'no',kioskCost:80000,kioskMonthly:1500,kioskBenefit:4000,aiCheck:'',before:'',after:'',decision:'',risk:'',sourceNote:'',roleNote:''};let d=load();const el=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'NT$'+Math.round(Number(n)||0).toLocaleString('en-US');function load(){try{const stored=JSON.parse(localStorage.getItem(STORAGE));const v={...structuredClone(defaults),...(stored||{})};if(!budgetPresets[v.budgetPreset])v.budgetPreset='custom';if(!Array.isArray(v.investment)||v.investment.length!==4)v.investment=budgetPresets[v.budgetPreset].items.map(x=>[...x]);return v}catch{return structuredClone(defaults)}}function save(){try{localStorage.setItem(STORAGE,JSON.stringify(d))}catch{}}function field(key,label,tip='',type='text'){let value=escape(d[key]);return `<label>${label}${tip?`<span class="hint">　${tip}</span>`:''}${type==='textarea'?`<textarea data-k="${key}" placeholder="請輸入具體、精簡的內容">${value}</textarea>`:`<input data-k="${key}" type="${type}" value="${value}" ${type==='number'?'min="0" step="1"':''}>`}</label>`}function number(key,label){return field(key,label,'可修改', 'number')}function fin(){const initial=d.investment.reduce((a,r)=>a+(Number(r[1])||0),0)+(d.kiosk==='buy'?Number(d.kioskCost)||0:0);const revenue=(+d.price||0)*(+d.customers||0)*(+d.days||0);const variable=(+d.unitCost||0)*(+d.customers||0)*(+d.days||0);const fixed=(+d.rent||0)+(+d.staff||0)+(+d.other||0)+(d.kiosk==='rent'?(+d.kioskMonthly||0):0);const benefit=d.kiosk==='no'?0:(+d.kioskBenefit||0);const profit=revenue-variable-fixed+benefit;const lowRevenue=revenue*.7,lowVariable=variable*.7,lowProfit=lowRevenue-lowVariable-fixed+benefit;return {initial,revenue,variable,fixed,benefit,profit,lowRevenue,lowProfit,payback:profit>0?(initial/profit):null,lowPayback:lowProfit>0?(initial/lowProfit):null};}const rentModes={manual:{label:'自行輸入／保留原數字',hint:'已有資料或希望自行估算，可以直接修改金額'},market:{label:'假日市集／短租攤位',hint:'假設場地費每營業日 500 元 × 每月營業天數'},shared:{label:'共享櫃位／寄售空間',hint:'假設每月固定場地使用費 12,000 元'},store:{label:'小型固定店面',hint:'假設月租 30,000 元；實際須查證商圈及坪數'},preorder:{label:'預購接單／無獨立店面',hint:'暫假設專屬店租 0 元，仍需留意合法製作場所與分攤費用'}};
const staffModes={manual:{label:'自行輸入／保留原數字',hint:'已有薪資估計可以保留原數值'},owner:{label:'老闆自己經營，暫不聘人',hint:'現金人事支出暫列 0 元，但老闆時間不是免費，評估時請說明'},part:{label:'老闆＋1 位兼職幫手',hint:'兼職薪資＝時薪 × 每天工作時數 × 每月營業天數'},full:{label:'聘請 1 位正職員工',hint:'假設每月總人事預算 36,000 元（非市場報價與法定薪資指引）'},mixed:{label:'1 位正職＋1 位兼職',hint:'正職月預算＋兼職時薪 × 工時 × 營業天數'}};
function assumedRent(){switch(d.rentMode){case 'market':return 500*Math.max(0,+d.days||0);case 'shared':return 12000;case 'store':return 30000;case 'preorder':return 0;default:return +d.rent||0}}
function assumedStaff(){const pt=(+d.hourlyRate||0)*(+d.partTimeHours||0)*(+d.days||0);switch(d.staffMode){case 'owner':return 0;case 'part':return pt;case 'full':return +d.fullTimeMonthly||0;case 'mixed':return (+d.fullTimeMonthly||0)+pt;default:return +d.staff||0}}
function applyMonthlyScenarios(){if(d.rentMode!=='manual')d.rent=assumedRent();if(d.staffMode!=='manual')d.staff=assumedStaff()}
function choiceOptions(o,selected){return Object.entries(o).map(([k,v])=>`<option value="${k}" ${selected===k?'selected':''}>${v.label}</option>`).join('')}
function monthlyGuideHTML(){return `<div class="story"><b>🏪 月租、人事不用從零猜！</b>先選經營方式，系統帶入教學情境金額。這些都不是實際店面報價，也不是法定薪資標準；想自行查價就選「自行輸入」。</div><div class="formgrid"><label>① 你們在哪裡營業？<select data-k="rentMode">${choiceOptions(rentModes,d.rentMode)}</select><span class="hint">${rentModes[d.rentMode].hint}</span></label><label>② 你們怎麼安排人手？<select data-k="staffMode">${choiceOptions(staffModes,d.staffMode)}</select><span class="hint">${staffModes[d.staffMode].hint}</span></label></div>${['part','mixed'].includes(d.staffMode)?`<div class="formgrid">${number('hourlyRate','兼職時薪（教學假設；元）')}${number('partTimeHours','每天兼職時數（小時）')}</div>`:''}${['full','mixed'].includes(d.staffMode)?`<div class="formgrid">${number('fullTimeMonthly','正職每月人事預算（元）')}</div>`:''}<p class="hint"><b>月租估算：</b>${d.rentMode==='market'?'500 × '+(+d.days||0)+' 天 = '+money(assumedRent()):rentModes[d.rentMode].hint}。<b>每月人事估算：</b>${d.staffMode==='part'||d.staffMode==='mixed'?money(+d.hourlyRate||0)+' × '+(+d.partTimeHours||0)+' 小時 × '+(+d.days||0)+' 天'+(d.staffMode==='mixed'?'，再加正職月預算':''):staffModes[d.staffMode].hint}。</p><div class="box">🧠 <b>老師提問：</b>如果改為預購接單，可以省下多少固定租金？但可能增加哪些工作與設備需求？</div>`}
function nav(){el('nav').innerHTML=stages.map((s,i)=>`<button class="step ${i===step?'active':''} ${i<step?'done':''}" data-step="${i}">${s}</button>`).join('');el('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>goto(+b.dataset.step))}function stageHTML(){const f=fin();if(step===0)return `<h2>① 餐飲抱怨大會：先想問題，再想開什麼店</h2><div class="story">🎤 每位組員先說出自己遇過的一個餐飲消費痛點。全組選一個最值得解決的問題，再各自想點子。<b>先人腦、後 AI。</b></div><div class="formgrid">${field('team','組別（例如第 1 組）')}${field('members','組員名單（可只寫姓名）')}</div>${field('pain','我們最想解決的餐飲痛點','','textarea')}${field('customer','目標顧客是誰？')}${field('problem','問題定義：誰在什麼情境有什麼困擾？','','textarea')}<h3>三種方案（先由同學提出，再請 AI 補充）</h3>${[0,1,2].map(i=>`<label>構想 ${i+1}<input data-idea="${i}" value="${escape(d.ideas[i])}" placeholder="例如：預訂免排隊早餐攤"></label>`).join('')}${field('chosen','最後選擇什麼店型？（完全自由，不限任何範例）')}${field('reason','為什麼選它？比較三個構想後的理由','','textarea')}${field('different','我們有什麼不同意見？如何整合？','','textarea')}<button class="btn alt" id="copyPrompt">複製 AI 創業發想提示詞</button>`;
if(step===1)return `<h2>② 商圈偵探社：客人為什麼不去隔壁買？</h2><div class="story">🔎 請用 Google Maps、官方菜單或可信資料找出 <b>三家真實競品</b>。不要讓 AI 虛構店名或售價；查不到就寫「待查」。</div><div class="formgrid">${field('shop','預計產品與店名')}${field('location','具體開店商圈／地點')}</div><div class="tablewrap"><table><tr><th>競爭店家</th><th>商品價格</th><th>優勢／特色</th><th>資料來源或待查</th></tr>${d.rivals.map((r,i)=>`<tr>${['name','price','pro','source'].map(k=>`<td><input data-rival="${i}" data-attr="${k}" value="${escape(r[k])}"></td>`).join('')}</tr>`).join('')}</table></div>${field('aiCheck','我們發現 AI 或網路資料哪個地方需要查證？','','textarea')}<div class="box">💬 投資人問：如果附近已有三家類似店，你的客人為什麼還要向你買？</div>`;
if(step===2)return `<h2>③ SWOT 生存戰：你憑什麼贏？</h2><p class="hint">每格寫一項即可。S / W 是自己內部條件；O / T 是外部環境。</p><div class="SWOT"><label>🟢 S｜優勢<textarea data-k="s">${escape(d.s)}</textarea></label><label>🟠 W｜劣勢<textarea data-k="w">${escape(d.w)}</textarea></label><label>🔵 O｜機會<textarea data-k="o">${escape(d.o)}</textarea></label><label>🔴 T｜威脅<textarea data-k="t">${escape(d.t)}</textarea></label></div>${field('strategy','我們準備採取的一項具體差異化策略','','textarea')}<div class="story">🎯 挑戰：不能只寫「好吃、服務好」！要說出具體做法，例如「線上預訂、3 分鐘取餐」。</div>`;
if(step===3)return `<h2>④ 金錢生存戰：每天真的有這麼多人買？</h2><div class="story">💰 以下金額是<b>示範假設，不是市場報價</b>。全組自行調整。計算由系統處理，重點在解釋假設是否可信。</div><h3>初期投資｜保留你們的創業店型，僅選『成本參考模板』</h3><div class="box">🏪 你們先前決定的創業構想：<b>${escape(d.chosen||d.shop||'尚未填寫，請先完成第一階段')}</b><br><span class="hint">下方是估算成本的參考，不是要求你改開咖啡店或飯糰店。若找不到相同店型，選「其他店型」即可。</span></div><div class="budget-head"><label>① 選擇估算用參考模板（不影響創業構想）<select id="budgetPreset">${Object.entries(budgetPresets).map(([key,t])=>`<option value="${key}" ${d.budgetPreset===key?'selected':''}>${t.name}｜教學預設 ${money(t.items.reduce((a,r)=>a+r[1],0))}</option>`).join('')}</select></label><button class="btn alt" type="button" id="resetBudget">恢復這個店型的預設值</button></div><p class="hint">這些是<b>為課堂練習設計的假設金額</b>，不是已查證的廠商報價或實際行情。若你的創業店型不在清單內，請選「其他店型」，再修改項目名稱和金額；也可借用相近模板。表格內容只是估算起點，請依真正的商品需求判斷，不必硬套。</p><div class="tablewrap"><table class="budget-table"><tr><th>② 項目與包含內容</th><th>預算（元）</th></tr>${d.investment.map((r,i)=>`<tr><td><input type="text" data-invest="${i}" data-col="0" value="${escape(r[0])}" aria-label="第 ${i+1} 項成本名稱" style="width:100%;min-width:130px"><div class="cost-note">${escape((budgetPresets[d.budgetPreset]||budgetPresets.custom).hints[i]||budgetHints[i]||'依實際需求調整')}</div></td><td><input type="number" min="0" step="1000" data-invest="${i}" data-col="1" value="${Number(r[1])||0}" aria-label="${escape(r[0])}預算"></td></tr>`).join('')}</table></div><div class="budget-total"><span>預估初期資金需求（未含另購的點餐機）</span><strong>${money(d.investment.reduce((a,r)=>a+(Number(r[1])||0),0))}</strong></div><label>③ 我們調整預算的理由（簡短寫一句即可）<textarea data-k="budgetReason" placeholder="例如：我們想做快閃攤，先租現成攤位，因此降低裝修費。">${escape(d.budgetReason||'')}</textarea></label><p class="budget-status">教學提示：押金通常可退還；週轉金是保留的現金，不等於一次花掉的成本。請勿把初期投資又全部當成每月費用扣除。</p><h3>每月經營假設｜先選模式再估算</h3><div class="formgrid">${number('price','平均客單價（元）')}${number('customers','每天成交人次')}${number('days','每月營業天數')}${number('unitCost','每筆交易平均變動成本（元）')}</div>${monthlyGuideHTML()}<div class="formgrid">${number('rent','月租金／場地費（元）')}${number('staff','每月現金人事支出（元）')}${number('other','水電、行銷等其他月費用（元）')}</div><p class="hint">上方兩個金額可自行修正；手動修改後將改成自行輸入模式，避免切換月份天數時覆蓋你們的金額。</p>${field('expenseReason','我們為什麼選這種場地和人力？（寫一句即可）','','textarea')}<h3>自助點餐機：選擇是否導入</h3><label>科技方案<select data-k="kiosk"><option value="no" ${d.kiosk==='no'?'selected':''}>不導入</option><option value="buy" ${d.kiosk==='buy'?'selected':''}>買斷（計入初期投資）</option><option value="rent" ${d.kiosk==='rent'?'selected':''}>租賃（計入每月費用）</option></select></label><div class="formgrid">${number('kioskCost','買斷設備費（元）')}${number('kioskMonthly','租賃月費（元）')}${number('kioskBenefit','預估每月淨效益（元；未扣租金）')}</div><div class="grid3"><div class="tile">初期投資<strong>${money(f.initial)}</strong></div><div class="tile">每月營收<strong>${money(f.revenue)}</strong></div><div class="tile">每月營業利益<strong class="${f.profit>=0?'good':'bad'}">${money(f.profit)}</strong></div></div><div class="box">簡化回收期：<b>${f.payback===null?'目前無法回本':f.payback.toFixed(1)+' 個月'}</b>；若顧客減少 30%，月利益 <b class="${f.lowProfit<0?'bad':'good'}">${money(f.lowProfit)}</b>，${f.lowPayback===null?'無法回本':'回收期約 '+f.lowPayback.toFixed(1)+' 個月'}。</div><p class="hint">說明：利益 = 營收 − 每筆變動成本 × 成交量 − 月固定成本 ＋ 預估科技淨效益。簡化回收期用初期投資÷月利益；不等同完整淨現金流回收模型。</p>`;
return `<h2>⑤ 投資決策：要開，還是不開？</h2><div class="story">⚖️ 好的可行性評估，不是一定要說「開店」。能以證據判斷暫緩創業，同樣是好決策。</div>${field('before','我們原本的創業方案','','textarea')}${field('after','市場與財務分析後，修正了什麼？','','textarea')}<label>是否建議創業？<select data-k="decision">${['','建議創業','有條件創業','暫緩創業'].map(v=>`<option value="${v}" ${d.decision===v?'selected':''}>${v||'請選擇'}</option>`).join('')}</select></label>${field('risk','最大風險與理由（請引用市場或財務數字）','','textarea')}${field('sourceNote','價格與市場資料來源／未驗證假設','','textarea')}${field('roleNote','團隊分工與討論簡述','','textarea')}<div class="box">📄 完成後點「預覽／列印報告」，選擇「另存為 PDF」。也請備份 JSON。<b>本網站不會自動上傳到 TronClass。</b></div><div class="grid3"><div class="tile">創業初期投資<strong>${money(f.initial)}</strong></div><div class="tile">月營業利益<strong>${money(f.profit)}</strong></div><div class="tile">回收期<strong>${f.payback===null?'無法回本':f.payback.toFixed(1)+' 月'}</strong></div></div>`}
function applyBudget(key){const preset=budgetPresets[key]||budgetPresets.custom;d.budgetPreset=budgetPresets[key]?key:'custom';d.investment=preset.items.map(row=>[...row]);d.budgetEdited=false;save();render()}function bind(){el('stage').querySelectorAll('[data-k]').forEach(x=>x.addEventListener(x.type==='number'||x.tagName==='SELECT'?'change':'input',()=>{d[x.dataset.k]=x.type==='number'?Number(x.value):x.value;if(step===3){let k=x.dataset.k;if(k==='rent')d.rentMode='manual';if(k==='staff')d.staffMode='manual';if(['days','rentMode','staffMode','hourlyRate','partTimeHours','fullTimeMonthly'].includes(k))applyMonthlyScenarios();save();if(['price','customers','days','unitCost','rent','staff','other','rentMode','staffMode','hourlyRate','partTimeHours','fullTimeMonthly','kiosk','kioskCost','kioskMonthly','kioskBenefit'].includes(k)){render();}}else save();}));el('stage').querySelectorAll('[data-idea]').forEach(x=>x.oninput=()=>{d.ideas[+x.dataset.idea]=x.value;save()});el('stage').querySelectorAll('[data-rival]').forEach(x=>x.oninput=()=>{d.rivals[+x.dataset.rival][x.dataset.attr]=x.value;save()});el('stage').querySelectorAll('[data-invest]').forEach(x=>x.onchange=()=>{const i=+x.dataset.invest;if(x.dataset.col==='0'){d.investment[i][0]=x.value.trim()||'未命名費用'}else{d.investment[i][1]=Math.max(0,Number(x.value)||0)}d.budgetEdited=true;save();render()});if(el('budgetPreset'))el('budgetPreset').onchange=e=>{const key=e.target.value;if(d.budgetEdited&&!confirm('切換店型會覆蓋已修改的四項預算，確定要切換嗎？')){render();return}applyBudget(key)};if(el('resetBudget'))el('resetBudget').onclick=()=>{if(d.budgetEdited&&!confirm('確定恢復這個店型的預設金額？'))return;applyBudget(d.budgetPreset||'custom')};if(el('copyPrompt'))el('copyPrompt').onclick=()=>{const prompt=`我們是餐旅系大二學生，目標顧客是：${d.customer||'待決定'}；遇到的痛點是：${d.pain||'待決定'}。我們已自行提出三個構想：${d.ideas.join('、')}。請另外提供兩種可行改善方法，並批判每個方案可能的問題；請標出未經查證的成本與市場假設，不要虛構實地訪談。`;navigator.clipboard?.writeText(prompt).then(()=>alert('已複製提示詞，可貼到免費 AI 工具')).catch(()=>promptFallback(prompt))};}function promptFallback(t){window.prompt('請複製以下文字',t)}function goto(n){step=Math.min(4,Math.max(0,n));save();render();window.scrollTo({top:0,behavior:'smooth'})}function render(){nav();el('stage').innerHTML=stageHTML()+`<div class="actions"><button class="btn alt" id="prev" ${step===0?'disabled':''}>← 上一步</button><button class="btn" id="next">${step===4?'預覽／列印報告':'儲存並前往下一關 →'}</button><button class="btn alt" id="backup">備份 JSON</button><label style="margin:0" class="btn alt">匯入 JSON<input type="file" accept=".json,application/json" id="import" style="display:none"></label></div>`;bind();el('prev').onclick=()=>goto(step-1);el('next').onclick=()=>step===4?printReport():goto(step+1);el('backup').onclick=backup;el('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||typeof obj!=='object'||!Array.isArray(obj.ideas)||!Array.isArray(obj.rivals))throw Error('格式不正確');d={...structuredClone(defaults),...obj};if(!budgetPresets[d.budgetPreset])d.budgetPreset='coffee';if(!Array.isArray(d.investment)||d.investment.length!==4)d.investment=budgetPresets[d.budgetPreset].items.map(r=>[...r]);save();render();alert('已還原資料')}catch(err){alert('匯入失敗：'+err.message)}}}function download(content,name,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),300)}function backup(){download(JSON.stringify({...d,version:3},null,2),((d.team||'未命名組')+'創業評估備份').replace(/[\\/:*?"<>|]/g,'_')+'.json','application/json')}function printReport(){const f=fin(),p=x=>escape(x||'尚未填寫'),moneyN=money,lines=d.rivals.map((r,i)=>`<tr><td>${i+1}</td><td>${p(r.name)}</td><td>${p(r.price)}</td><td>${p(r.pro)}</td><td>${p(r.source)}</td></tr>`).join('');const paper=(n,title,body)=>`<section class="paper"><div class="small">AI 餐飲創業工作坊｜${p(d.team)}｜第 ${n}/4 頁</div><h1>${title}</h1>${body}</section>`;el('report').innerHTML=paper(1,'01｜設計思考與創業構想',`<h2>${p(d.team)}｜${p(d.shop||d.chosen)}</h2><p><b>組員：</b>${p(d.members)}</p><h3>Empathize 顧客同理</h3><div class="pbox">${p(d.pain)}</div><h3>Define 顧客與問題</h3><div class="pbox">${p(d.customer)}｜${p(d.problem)}</div><h3>Ideate 三個構想</h3><div class="pbox">${d.ideas.map((a,i)=>`${i+1}. ${p(a)}`).join('\n')}</div><h3>方案選擇與團隊意見整合</h3><div class="pbox">選擇：${p(d.chosen)}\n原因：${p(d.reason)}\n不同意見：${p(d.different)}</div>`)+paper(2,'02｜競爭者與 SWOT',`<p><b>開店商圈：</b>${p(d.location)}</p><h3>三家競爭對手</h3><table><tr><th>序</th><th>店家</th><th>售價</th><th>特色</th><th>資料來源</th></tr>${lines}</table><h3>SWOT</h3><div class="twocol"><div><b>S 優勢</b><p>${p(d.s)}</p></div><div><b>W 劣勢</b><p>${p(d.w)}</p></div><div><b>O 機會</b><p>${p(d.o)}</p></div><div><b>T 威脅</b><p>${p(d.t)}</p></div></div><h3>差異化策略</h3><div class="pbox">${p(d.strategy)}</div><h3>資料批判與查核</h3><div class="pbox">${p(d.aiCheck)}</div>`)+paper(3,'03｜創業財務與回收期',`<h3>初期投資｜創業店型：${p(d.chosen||d.shop)}</h3><p class="small">成本估算參考模板：${p((budgetPresets[d.budgetPreset]||budgetPresets.custom).name)}（僅用來提供假設金額，不代表實際經營業態）</p><p class="small">以下金額為教學估算，尚未取得正式報價。</p><table><tr><th>項目</th><th>金額</th></tr>${d.investment.map(x=>`<tr><td>${p(x[0])}</td><td>${moneyN(x[1])}</td></tr>`).join('')}<tr><th>總計（含自助點餐機買斷費）</th><th>${moneyN(f.initial)}</th></tr></table><p><b>調整預算理由：</b>${p(d.budgetReason)}</p><div class="twocol"><div>平均客單價：${moneyN(d.price)}<br>每日成交：${d.customers} 人<br>每月營業：${d.days} 天<br>單筆變動成本：${moneyN(d.unitCost)}</div><div>月租金：${moneyN(d.rent)}<br>月人事：${moneyN(d.staff)}<br>其他月費用：${moneyN(d.other)}<br>自助點餐機：${p(({no:'不導入',buy:'買斷',rent:'租賃'})[d.kiosk])}</div></div><p><b>場地假設：</b>${p((rentModes[d.rentMode]||rentModes.manual).label)}｜<b>人力假設：</b>${p((staffModes[d.staffMode]||staffModes.manual).label)}</p><p><b>估算理由：</b>${p(d.expenseReason)}</p><p class="small">教學模式的租金及人事皆為示範假設；自行經營仍有時間機會成本，實際雇用需核對法規、工時及雇主負擔。</p><h3>月度財務結果</h3><table><tr><td>月營收</td><td>${moneyN(f.revenue)}</td></tr><tr><td>變動成本</td><td>${moneyN(f.variable)}</td></tr><tr><td>固定費用（含租賃月費）</td><td>${moneyN(f.fixed)}</td></tr><tr><td>科技預估月效益</td><td>${moneyN(f.benefit)}</td></tr><tr><th>月營業利益</th><th>${moneyN(f.profit)}</th></tr></table><h3>簡化回收期：${f.payback===null?'目前無法回本':f.payback.toFixed(1)+' 個月'}</h3><div class="pbox">客流下降 30% 後，月營業利益為 ${moneyN(f.lowProfit)}，${f.lowPayback===null?'無法回本':`回收期約 ${f.lowPayback.toFixed(1)} 個月`}。</div><p class="small">上述為教學試算，不含稅務、折舊調整、資金成本與完整現金流；市場與費用假設仍需驗證。</p>`)+paper(4,'04｜創業決策與設計思考反思',`<h3>原本構想</h3><div class="pbox">${p(d.before)}</div><h3>測試後如何修改</h3><div class="pbox">${p(d.after)}</div><h3>創業決定：${p(d.decision)}</h3><div class="pbox">最大風險、分析依據：${p(d.risk)}</div><h3>資料來源與仍待查證的假設</h3><div class="pbox">${p(d.sourceNote)}</div><h3>團隊分工、討論與 AI 使用</h3><div class="pbox">${p(d.roleNote)}\nAI 查核：${p(d.aiCheck)}</div><p class="small">本報告為 150 分鐘課堂可行性評估初稿。資料調查和設備報價可能未完整，尚非正式貸款申請計畫書。</p>`);setTimeout(()=>window.print(),180)}render();})();
</script></body></html>
